version: '3.8'
name: takatsuki-bus-service

services:

  web:
    image: nginx:alpine
    container_name: tbs.web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - bus-network
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbs.php
    volumes:
      - .:/var/www/html
    networks:
      - bus-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: tbs-db-container
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bus_timetable
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - bus-network

networks:
  bus-network:
    driver: bridge

volumes:
  db-data:
